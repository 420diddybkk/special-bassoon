    <style>

            height: 36px;

            color: white;
            font-weight: bold;
            font-size: 11px;

        }

            <div class="grid grid-cols-3 gap-3 text-center">

                </div>
                <div class="bg-danger/10 rounded-lg p-3">
                    <p class="text-xs text-gray-500">Occupied</p>
                    <p id="totalOccupied" class="text-xl font-bold text-danger">0</p>
                </div>
                <div class="bg-primary/10 rounded-lg p-3">
                    <p class="text-xs text-gray-500">Total Capacity</p>
                    <p id="totalSpaces" class="text-xl font-bold text-primary">0</p>
                </div>
            </div>
        </div>

        <div class="flex mb-4 border-b">
            <button class="tab-btn active px-4 py-2 font-medium text-primary border-b-2 border-primary" data-view="map">
                <i class="fa fa-map-o mr-1"></i> Map
            </button>
            <button class="tab-btn px-4 py-2 font-medium text-gray-500" data-view="list">

        </div>

        <div id="mapView" class="tab-content">

        </div>

        </div>
    </main>

            {id:94,name:"Kasetsart University",address:"Phahonyothin Rd, Chatuchak",avail:189,total:750,lat:13.8400,lng:100.5700,type:"Public",fee:"฿20/hr"},
            {id:95,name:"Ramkhamhaeng Univ",address:"Ramkhamhaeng Rd, Bang Kapi",avail:167,total:650,lat:13.7500,lng:100.6500,type:"Public",fee:"฿20/hr"},
            {id:96,name:"Rattanakosin Exhibition Hall",address:"Ratchadamnoen Klang",avail:38,total:130,lat:13.7530,lng:100.5080,type:"Tourist",fee:"฿30/hr"},
            {id:97,name:"Queen Sirikit Convention",address:"Ratchadaphisek Rd",avail:345,total:1500,lat:13.7200,lng:100.5600,type:"Public",fee:"฿30/hr"},
            {id:98,name:"Central Embassy",address:"Ploenchit Rd, Pathum Wan",avail:89,total:500,lat:13.7420,lng:100.5400,type:"Mall",fee:"฿60/hr"},
            {id:99,name:"Iconsiam River Side",address:"Charoen Nakhon Rd",avail:134,total:600,lat:13.7230,lng:100.5090,type:"Mall",fee:"Free 3hrs"},
            {id:100,name:"Bangkok Eye/River Park",address:"Charoen Krung Rd",avail:112,total:450,lat:13.7120,lng:100.5110,type:"Tourist",fee:"฿35/hr"}
        ];

        let filteredData = [...parkingData];
        let currentFilter = 'all';
        let map;
        let markers = [];

        function initMap() {
            map = L.map('map').setView([13.755, 100.540], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            renderMarkers();
        }

        function getStatusColor(avail, total) {
            const ratio = avail / total;
            if (ratio > 0.3) return '#00B42A';
            if (ratio > 0.1) return '#FF7D00';
            return '#F53F3F';
        }

        function createCustomIcon(avail, total) {
            const color = getStatusColor(avail, total);
            return L.divIcon({
                html: `<div class="custom-marker" style="background:${color}">${avail}</div>`,
                className: '',
                iconSize: [36, 36],
                iconAnchor: [18, 18]
            });
        }

        function renderMarkers() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            filteredData.forEach(place => {
                const marker = L.marker([place.lat, place.lng], {
                    icon: createCustomIcon(place.avail, place.total)
                }).addTo(map);
                marker.bindPopup(`
                    <div class="p-1 min-w-[220px]">
                        <h3 class="font-bold text-primary text-lg">${place.name}</h3>
                        <p class="text-xs text-gray-500 my-2">${place.address}</p>
                        <p class="text-sm font-semibold text-lg">
                            <span style="color:${getStatusColor(place.avail, place.total)}; font-size:1.25rem">${place.avail}</span>
                            <span class="text-gray-400"> / </span>${place.total} spots
                        </p>
                        <p class="text-xs text-gray-500 mt-2">${place.type} • ${place.fee}</p>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}" 
                           target="_blank" class="block mt-3 text-center bg-primary text-white py-2 rounded-lg">
                            <i class="fa fa-directions"></i> Get Directions
                        </a>
                    </div>
                `);
                markers.push(marker);
            });
        }

        function renderList() {
            const container = document.getElementById('parkingList');
            container.innerHTML = '';
            filteredData.forEach(place => {
                const pctUsed = Math.round(((place.total - place.avail) / place.total) * 100);
                const colorClass = getStatusColor(place.avail, place.total) === '#00B42A' ? 'success' :
                                  getStatusColor(place.avail, place.total) === '#FF7D00' ? 'warning' : 'danger';
                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm p-4 hover:shadow-md transition">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-sm">${place.name}</h3>
                            <span class="text-xs bg-gray-100 px-2 py-1 rounded-full whitespace-nowrap">${place.type}</span>
                        </div>
                        <p class="text-xs text-gray-500 mb-2">${place.address}</p>
                        <div class="flex items-center gap-2 mb-2">
                            <div class="flex-1 bg-gray-100 rounded-full h-2">
                                <div class="bg-${colorClass} h-2 rounded-full" style="width: ${pctUsed}%"></div>
                            </div>
                            <span class="font-bold text-${colorClass}">${place.avail}</span>
                        </div>
                        <p class="text-xs text-gray-600 mb-2">${place.avail}/${place.total} • ${place.fee}</p>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}" 
                           target="_blank" class="block text-center bg-primary/10 text-primary py-1.5 rounded text-sm font-medium">
                            <i class="fa fa-external-link"></i> Navigate
                        </a>
                    </div>
                `;
            });
        }

        function updateStats() {
            const avail = filteredData.reduce((s, p) => s + p.avail, 0);
            const total = filteredData.reduce((s, p) => s + p.total, 0);
            document.getElementById('totalAvailable').textContent = avail.toLocaleString();
            document.getElementById('totalOccupied').textContent = (total - avail).toLocaleString();
            document.getElementById('totalSpaces').textContent = total.toLocaleString();
            document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
        }

        function simulateLiveUpdate() {
            parkingData.forEach(place => {
                const change = Math.floor(Math.random() * 5) - 2;
                place.avail = Math.max(0, Math.min(place.total, place.avail + change));
            });
            applyFilters();
        }

        function applyFilters() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            filteredData = parkingData.filter(p => {
                const matchesSearch = q === '' || 
                    p.name.toLowerCase().includes(q) || 
                    p.address.toLowerCase().includes(q) || 
                    p.type.toLowerCase().includes(q);
                const matchesType = currentFilter === 'all' || p.type.includes(currentFilter);
                return matchesSearch && matchesType;
            });
            renderMarkers();
            renderList();
            updateStats();
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilters();
            });
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('active', 'text-primary', 'border-b-2', 'border-primary');
                    b.classList.add('text-gray-500');
                });
                btn.classList.add('active', 'text-primary', 'border-b-2', 'border-primary');
                btn.classList.remove('text-gray-500');
                const view = btn.dataset.view;
                document.getElementById('mapView').classList.toggle('hidden', view !== 'map');
                document.getElementById('listView').classList.toggle('hidden', view !== 'list');
                if (view === 'map') setTimeout(() => map.invalidateSize(), 100);
            });
        });

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('refreshBtn').addEventListener('click', simulateLiveUpdate);
        setInterval(simulateLiveUpdate, 10000);

        initMap();
        applyFilters();
    </script>
</body>
</html>
